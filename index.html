<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbf7" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before first paint, so dark mode doesn't flash white. Kept in
         sync with src/theme.js. -->
    <script>
      (function () {
        var preference = null;
        try { preference = localStorage.getItem("outfitted.theme"); } catch (e) {}
        var dark = preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Outfitted — Good fits are better together.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    />
